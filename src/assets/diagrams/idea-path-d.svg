<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="ipd-t ipd-d">
  <title id="ipd-t">Path of an idea (loop)</title>
  <desc id="ipd-d">Eight steps from an idea to a commit: idea, concept with options, question in the inbox, your answer, task, builder, reviewer, commit. The steps form a ring around the board and journal.</desc>

  <style>
    .ipd text { font-family: var(--sl-font, system-ui, sans-serif); fill: var(--sl-color-gray-2, #353841); }
    .ipd .h { font-size: 16px; font-weight: 700; fill: var(--sl-color-white, #17181c); }
    .ipd .s { font-size: 12px; }
    .ipd .n { font-size: 13px; font-weight: 700; text-anchor: middle; fill: var(--sl-color-white, #17181c); }
    .ipd .ln { fill: none; stroke: var(--sl-color-gray-3, #545861); stroke-width: 2; }
    .ipd .thin { fill: none; stroke: var(--sl-color-gray-4, #8a8d94); stroke-width: 1.5; }
    .ipd .tip { fill: var(--sl-color-gray-3, #545861); }
    .ipd .you { fill: var(--sl-color-orange-low, #fbe5cc); stroke: var(--sl-color-orange, #c4600a); stroke-width: 2; }
    .ipd .asst { fill: var(--sl-color-accent-low, #d9e1ff); stroke: var(--sl-color-accent, #4d4dd6); stroke-width: 2; }
    .ipd .wrk { fill: var(--sl-color-green-low, #cdeed8); stroke: var(--sl-color-green, #1f7a42); stroke-width: 2; }
    .ipd .lane { fill: var(--sl-color-gray-6, #eceef2); stroke: var(--sl-color-gray-5, #c0c2c7); stroke-width: 1; }
    .ipd .band { fill: none; stroke: var(--sl-color-gray-4, #8a8d94); stroke-width: 1.5; stroke-dasharray: 2 4; }
  </style>

  <defs><marker id="ipd-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path class="tip" d="M0 0 L10 5 L0 10 z"/></marker></defs>

  <g class="ipd">
    <ellipse class="band" cx="360" cy="200" rx="105" ry="55"/><text class="h" x="360" y="198" text-anchor="middle">Board</text><text class="s" x="360" y="217" text-anchor="middle">and journal</text>
    <path class="ln" d="M397 67 A215 135 0 0 1 477 87" marker-end="url(#ipd-ar)"/>
    <path class="ln" d="M536 123 A215 135 0 0 1 570 172" marker-end="url(#ipd-ar)"/>
    <path class="ln" d="M572 223 A215 135 0 0 1 540 274" marker-end="url(#ipd-ar)"/>
    <path class="ln" d="M483 311 A215 135 0 0 1 405 332" marker-end="url(#ipd-ar)"/>
    <path class="ln" d="M323 333 A215 135 0 0 1 243 313" marker-end="url(#ipd-ar)"/>
    <path class="ln" d="M184 277 A215 135 0 0 1 150 228" marker-end="url(#ipd-ar)"/>
    <path class="ln" d="M148 177 A215 135 0 0 1 180 126" marker-end="url(#ipd-ar)"/>
    <path class="ln" d="M237 89 A215 135 0 0 1 315 68" marker-end="url(#ipd-ar)"/>
    <circle class="you" cx="360" cy="65" r="19"/><text class="n" x="360" y="70">1</text>
    <text class="h" x="360" y="35" text-anchor="middle">Idea</text>
    <circle class="asst" cx="512" cy="105" r="19"/><text class="n" x="512" y="110">2</text>
    <text class="h" x="542" y="110" text-anchor="start">Concept</text>
    <circle class="asst" cx="575" cy="200" r="19"/><text class="n" x="575" y="205">3</text>
    <text class="h" x="605" y="205" text-anchor="start">Question</text>
    <circle class="you" cx="512" cy="295" r="19"/><text class="n" x="512" y="300">4</text>
    <text class="h" x="542" y="300" text-anchor="start">Your answer</text>
    <circle class="asst" cx="360" cy="335" r="19"/><text class="n" x="360" y="340">5</text>
    <text class="h" x="360" y="375" text-anchor="middle">Task</text>
    <circle class="wrk" cx="208" cy="295" r="19"/><text class="n" x="208" y="300">6</text>
    <text class="h" x="178" y="300" text-anchor="end">builder</text>
    <circle class="wrk" cx="145" cy="200" r="19"/><text class="n" x="145" y="205">7</text>
    <text class="h" x="115" y="205" text-anchor="end">reviewer</text>
    <circle class="asst" cx="208" cy="105" r="19"/><text class="n" x="208" y="110">8</text>
    <text class="h" x="178" y="110" text-anchor="end">Commit</text>
  </g>
</svg>
