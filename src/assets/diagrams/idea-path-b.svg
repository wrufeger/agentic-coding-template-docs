<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 590" role="img" aria-labelledby="ipb-t ipb-d">
  <title id="ipb-t">Path of an idea (vertical track)</title>
  <desc id="ipb-d">Eight steps from an idea to a commit: idea, concept with options, question in the inbox, your answer, task, builder, reviewer, commit. Board and journal run alongside all steps.</desc>

  <style>
    .ipb text { font-family: var(--sl-font, system-ui, sans-serif); fill: var(--sl-color-gray-2, #353841); }
    .ipb .h { font-size: 16px; font-weight: 700; fill: var(--sl-color-white, #17181c); }
    .ipb .s { font-size: 12px; }
    .ipb .n { font-size: 13px; font-weight: 700; text-anchor: middle; fill: var(--sl-color-white, #17181c); }
    .ipb .ln { fill: none; stroke: var(--sl-color-gray-3, #545861); stroke-width: 2; }
    .ipb .thin { fill: none; stroke: var(--sl-color-gray-4, #8a8d94); stroke-width: 1.5; }
    .ipb .tip { fill: var(--sl-color-gray-3, #545861); }
    .ipb .you { fill: var(--sl-color-orange-low, #fbe5cc); stroke: var(--sl-color-orange, #c4600a); stroke-width: 2; }
    .ipb .asst { fill: var(--sl-color-accent-low, #d9e1ff); stroke: var(--sl-color-accent, #4d4dd6); stroke-width: 2; }
    .ipb .wrk { fill: var(--sl-color-green-low, #cdeed8); stroke: var(--sl-color-green, #1f7a42); stroke-width: 2; }
    .ipb .lane { fill: var(--sl-color-gray-6, #eceef2); stroke: var(--sl-color-gray-5, #c0c2c7); stroke-width: 1; }
    .ipb .band { fill: none; stroke: var(--sl-color-gray-4, #8a8d94); stroke-width: 1.5; stroke-dasharray: 2 4; }
  </style>

  <defs><marker id="ipb-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path class="tip" d="M0 0 L10 5 L0 10 z"/></marker></defs>

  <g class="ipb">
    <rect class="band" x="672" y="20" width="36" height="550" rx="10"/>
    <text class="s" transform="translate(695 295) rotate(90)" text-anchor="middle">board and journal</text>
    <path class="ln" d="M40 40 V544"/>
    <circle class="you" cx="40" cy="40" r="17"/><text class="n" x="40" y="45">1</text>
    <text class="h" x="76" y="37">Idea</text><text class="s" x="76" y="56">You say it in the chat or write it into your ideas file.</text>
    <rect class="you" x="560" y="28" width="86" height="24" rx="12"/><text class="s" x="603" y="44" text-anchor="middle">you</text>
    <circle class="asst" cx="40" cy="112" r="17"/><text class="n" x="40" y="117">2</text>
    <text class="h" x="76" y="109">Concept with options</text><text class="s" x="76" y="128">Checks what exists, then options with a recommendation.</text>
    <rect class="asst" x="560" y="100" width="86" height="24" rx="12"/><text class="s" x="603" y="116" text-anchor="middle">assistant</text>
    <circle class="asst" cx="40" cy="184" r="17"/><text class="n" x="40" y="189">3</text>
    <text class="h" x="76" y="181">Question in the inbox</text><text class="s" x="76" y="200">One file, options a), b), c), nothing is built before the answer.</text>
    <rect class="asst" x="560" y="172" width="86" height="24" rx="12"/><text class="s" x="603" y="188" text-anchor="middle">assistant</text>
    <circle class="you" cx="40" cy="256" r="17"/><text class="n" x="40" y="261">4</text>
    <text class="h" x="76" y="253">Your answer</text><text class="s" x="76" y="272">You decide below Answer: and the assistant books it.</text>
    <rect class="you" x="560" y="244" width="86" height="24" rx="12"/><text class="s" x="603" y="260" text-anchor="middle">you</text>
    <circle class="asst" cx="40" cy="328" r="17"/><text class="n" x="40" y="333">5</text>
    <text class="h" x="76" y="325">Task</text><text class="s" x="76" y="344">Goal and check criteria in one file, shown on the board.</text>
    <rect class="asst" x="560" y="316" width="86" height="24" rx="12"/><text class="s" x="603" y="332" text-anchor="middle">assistant</text>
    <circle class="wrk" cx="40" cy="400" r="17"/><text class="n" x="40" y="405">6</text>
    <text class="h" x="76" y="397">builder</text><text class="s" x="76" y="416">A worker builds it inside its write scope and returns evidence.</text>
    <rect class="wrk" x="560" y="388" width="86" height="24" rx="12"/><text class="s" x="603" y="404" text-anchor="middle">worker</text>
    <circle class="wrk" cx="40" cy="472" r="17"/><text class="n" x="40" y="477">7</text>
    <text class="h" x="76" y="469">reviewer</text><text class="s" x="76" y="488">Adversarial review: ALLOW, CONDITIONAL or BLOCK (BLOCK goes back).</text>
    <rect class="wrk" x="560" y="460" width="86" height="24" rx="12"/><text class="s" x="603" y="476" text-anchor="middle">worker</text>
    <circle class="asst" cx="40" cy="544" r="17"/><text class="n" x="40" y="549">8</text>
    <text class="h" x="76" y="541">Commit</text><text class="s" x="76" y="560">The orchestrator commits by pathspec, the journal gets its entry.</text>
    <rect class="asst" x="560" y="532" width="86" height="24" rx="12"/><text class="s" x="603" y="548" text-anchor="middle">assistant</text>
  </g>
</svg>
