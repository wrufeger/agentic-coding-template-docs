<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 366" role="img" aria-labelledby="ipc-t ipc-d">
  <title id="ipc-t">Path of an idea (swim lanes)</title>
  <desc id="ipc-d">Eight steps from an idea to a commit: idea, concept with options, question in the inbox, your answer, task, builder, reviewer, commit. The path moves between you, the assistant and the workers.</desc>

  <style>
    .ipc text { font-family: var(--sl-font, system-ui, sans-serif); fill: var(--sl-color-gray-2, #353841); }
    .ipc .h { font-size: 16px; font-weight: 700; fill: var(--sl-color-white, #17181c); }
    .ipc .s { font-size: 12px; }
    .ipc .n { font-size: 13px; font-weight: 700; text-anchor: middle; fill: var(--sl-color-white, #17181c); }
    .ipc .ln { fill: none; stroke: var(--sl-color-gray-3, #545861); stroke-width: 2; }
    .ipc .thin { fill: none; stroke: var(--sl-color-gray-4, #8a8d94); stroke-width: 1.5; }
    .ipc .tip { fill: var(--sl-color-gray-3, #545861); }
    .ipc .you { fill: var(--sl-color-orange-low, #fbe5cc); stroke: var(--sl-color-orange, #c4600a); stroke-width: 2; }
    .ipc .asst { fill: var(--sl-color-accent-low, #d9e1ff); stroke: var(--sl-color-accent, #4d4dd6); stroke-width: 2; }
    .ipc .wrk { fill: var(--sl-color-green-low, #cdeed8); stroke: var(--sl-color-green, #1f7a42); stroke-width: 2; }
    .ipc .lane { fill: var(--sl-color-gray-6, #eceef2); stroke: var(--sl-color-gray-5, #c0c2c7); stroke-width: 1; }
    .ipc .band { fill: none; stroke: var(--sl-color-gray-4, #8a8d94); stroke-width: 1.5; stroke-dasharray: 2 4; }
  </style>

  <defs><marker id="ipc-ar" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="10" orient="auto"><path class="tip" d="M0 0 L10 5 L0 10 z"/></marker></defs>

  <g class="ipc">
    <rect class="lane" x="0" y="20" width="720" height="96"/><text class="h" x="12" y="73">You</text>
    <rect class="lane" x="0" y="116" width="720" height="96"/><text class="h" x="12" y="169">Assistant</text>
    <rect class="lane" x="0" y="212" width="720" height="96"/><text class="h" x="12" y="265">Workers</text>
    <path class="ln" d="M160 83 L212 148" marker-end="url(#ipc-ar)"/>
    <path class="ln" d="M243 164 L281 164" marker-end="url(#ipc-ar)"/>
    <path class="ln" d="M313 149 L365 84" marker-end="url(#ipc-ar)"/>
    <path class="ln" d="M389 83 L441 148" marker-end="url(#ipc-ar)"/>
    <path class="ln" d="M465 179 L517 244" marker-end="url(#ipc-ar)"/>
    <path class="ln" d="M548 260 L586 260" marker-end="url(#ipc-ar)"/>
    <path class="ln" d="M618 245 L670 180" marker-end="url(#ipc-ar)"/>
    <circle class="you" cx="148" cy="68" r="17"/><text class="n" x="148" y="73">1</text>
    <text class="s" x="123" y="72" text-anchor="end">Idea</text>
    <circle class="asst" cx="224" cy="164" r="17"/><text class="n" x="224" y="169">2</text>
    <text class="s" x="224" y="200" text-anchor="middle">Concept</text>
    <circle class="asst" cx="301" cy="164" r="17"/><text class="n" x="301" y="169">3</text>
    <text class="s" x="301" y="200" text-anchor="middle">Question</text>
    <circle class="you" cx="377" cy="68" r="17"/><text class="n" x="377" y="73">4</text>
    <text class="s" x="402" y="64" text-anchor="start">Answer</text>
    <circle class="asst" cx="453" cy="164" r="17"/><text class="n" x="453" y="169">5</text>
    <text class="s" x="428" y="168" text-anchor="end">Task</text>
    <circle class="wrk" cx="529" cy="260" r="17"/><text class="n" x="529" y="265">6</text>
    <text class="s" x="529" y="296" text-anchor="middle">builder</text>
    <circle class="wrk" cx="606" cy="260" r="17"/><text class="n" x="606" y="265">7</text>
    <text class="s" x="606" y="296" text-anchor="middle">reviewer</text>
    <circle class="asst" cx="682" cy="164" r="17"/><text class="n" x="682" y="169">8</text>
    <text class="s" x="682" y="138" text-anchor="middle">Commit</text>
    <rect class="band" x="0" y="318" width="720" height="38" rx="10"/><text class="s" x="360" y="342" text-anchor="middle">Board and journal: every step is a file</text>
  </g>
</svg>
